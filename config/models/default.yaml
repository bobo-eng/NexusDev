# Default LLM Model Configuration

default_provider: openai
default_model: MiniMax-M2.5

providers:
  openai:
    name: OpenAI (MiniMax)
    base_url: https://api.minimax.chat/v1
    api_key: ${OPENAI_API_KEY}
    models:
      - name: MiniMax-M2.5
        context_window: 100000
        max_tokens: 8192
        temperature: 0.2

# Agent-specific model assignments
agent_models:
  pm_agent:
    provider: openai
    model: MiniMax-M2.5
    temperature: 0.3
  
  architect_agent:
    provider: openai
    model: MiniMax-M2.5
    temperature: 0.2
  
  coder_agent:
    provider: openai
    model: MiniMax-M2.5
    temperature: 0.1
  
  reviewer_agent:
    provider: openai
    model: MiniMax-M2.5
    temperature: 0.1
  
  tester_agent:
    provider: openai
    model: MiniMax-M2.5
    temperature: 0.2

fallback:
  enabled: false
